<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ikram Translator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f7f5;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #ccc;
    }

    h1 {
      text-align: center;
      color: #16834a;
    }

    p {
      text-align: center;
      color: #555;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 18px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #16834a;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #106638;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      min-height: 80px;
      background: #f1f8f4;
      border-radius: 10px;
      font-size: 20px;
      line-height: 1.6;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Ikram Translator</h1>

    <p>English to Sindhi Translator</p>

    <textarea id="englishText" placeholder="Write English words or sentences here..."></textarea>

    <button onclick="translateText()">Translate to Sindhi</button>

    <div id="result">
      Sindhi translation will appear here.
    </div>

    <div class="footer">
      Created by Ikram
    </div>

  </div>

  <script>
    async function translateText() {

      const text = document.getElementById("englishText").value.trim();
      const result = document.getElementById("result");

      if (text === "") {
        result.innerText = "Please write something in English.";
        return;
      }

      result.innerText = "Translating...";

      try {

        const url =
          "https://api.mymemory.translated.net/get?q=" +
          encodeURIComponent(text) +
          "&langpair=en|sd";

        const response = await fetch(url);
        const data = await response.json();

        if (data.responseData && data.responseData.translatedText) {
          result.innerText = data.responseData.translatedText;
        } else {
          result.innerText = "Translation not found.";
        }

      } catch (error) {

        result.innerText =
          "Internet connection or translation service problem.";

      }
    }
  </script>

</body>
</html>
